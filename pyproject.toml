[project]
name = "mocker"
version = "0.1.0"
description = "A simple mock API server built with Python FastAPI that logs incoming API requests"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "TejGandham" }
]

dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]
